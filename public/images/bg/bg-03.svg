<svg
  xmlns="http://www.w3.org/2000/svg"
  width="600"
  height="600"
  viewBox="0 0 600 600"
>
  <defs>
    <filter
      id="noise1"
      x="0"
      y="0"
      width="100%"
      height="100%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.9"
        numOctaves="2"
        seed="7"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="matrix"
        values="
          0 0 0 0 0.42
          0 0 0 0 0.32
          0 0 0 0 0.22
          0 0 0 0.22 0"
      />
    </filter>
  </defs>

  <rect
    width="600"
    height="600"
    fill="#F3E2C7"
  />
  <rect
    width="600"
    height="600"
    filter="url(#noise1)"
  />
</svg>
